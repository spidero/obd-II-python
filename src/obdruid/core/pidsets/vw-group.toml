# VW group (VW, Audi, Seat, Škoda, Cupra) – engine and gearbox - manufacturer parameters converted from OBDb.
#
# NOT VERIFIED ON A CAR. Generated by tools/obdb_convert.py from the community database OBDb
# (https://github.com/OBDb, signalsets/v3/default.json of the repositories listed below).
# Only modules 7E0-7E7 (engine, gearbox) with services 22 and 21; the parameters shared by
# the most models come first. Switch the set on for a car: the program asks for every
# parameter once and keeps the ones the car answers. Treat the values with care.
#
# License of this file: CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/),
# the license of OBDb. Changes made: merged over models, converted to the OBDruid PID set
# format (bit positions to byte formulas, imperial units to metric), Polish labels added.
# Converted on 2026-11-16 from 69 repositories:
#   Audi, Audi-A1, Audi-A3, Audi-A3-e-tron, Audi-A4, Audi-A5, Audi-A6, Audi-A7, Audi-Q2, Audi-Q3
#   Audi-Q5, Audi-Q7, Audi-Q8, Audi-Q8-e-tron, Audi-RS-3, Audi-RS-5, Audi-RS-e-tron, Audi-S3
#   Audi-S4, Audi-S5, Audi-S6, Audi-SQ2, Audi-SQ5, Audi-SQ7, Audi-SQ8, Audi-TT, Audi-TTS
#   Audi-e-tron, Audi-e-tron-GT, Cupra, Cupra-Formentor, Cupra-Leon, Seat-Alhambra, Seat-Arona
#   Seat-Ateca, Seat-Ibiza, Seat-Leon, Seat-Mii, Seat-Mii-Electric, Seat-Tarraco, Skoda
#   Skoda-Citigo-e-iV, Volkswagen, Volkswagen-Amarok, Volkswagen-Arteon, Volkswagen-Atlas
#   Volkswagen-Beetle, Volkswagen-Beetle-Convertible, Volkswagen-CC, Volkswagen-Crafter
#   Volkswagen-Golf, Volkswagen-Jetta, Volkswagen-Jetta-GLI, Volkswagen-Passat, Volkswagen-Polo
#   Volkswagen-Scirocco, Volkswagen-T-Cross, Volkswagen-T-Roc, Volkswagen-T6-Transporter
#   Volkswagen-Taigo, Volkswagen-Taos, Volkswagen-Tiguan, Volkswagen-Touareg, Volkswagen-Touran
#   Volkswagen-Transporter, Volkswagen-Up, Volkswagen-Virtus, Volkswagen-e-Golf, Volkswagen-e-Up
format = 1
id = "vw-group"
name = "VW group (VW, Audi, Seat, Škoda, Cupra) – engine and gearbox"
source = "OBDb (github.com/OBDb), converted with tools/obdb_convert.py; not verified on a car"
license = "CC BY-SA 4.0"
note = "Candidates from a community database, merged over many models and engines: a car answers only some of them. Probing shows which ones."

[match]
wmi = ["WVW", "WV1", "WV2", "WVG", "3VW", "9BW", "WAU", "WA1", "TRU", "VSS", "TMB"]

[[params]]
key = "MASS_AIRFLOW_SENSOR_1_BANK"
