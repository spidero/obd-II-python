# Renault / Dacia – engine and gearbox - manufacturer parameters converted from OBDb.
#
# NOT VERIFIED ON A CAR. Generated by tools/obdb_convert.py from the community database OBDb
# (https://github.com/OBDb, signalsets/v3/default.json of the repositories listed below).
# Only modules 7E0-7E7 (engine, gearbox) with services 22 and 21; the parameters shared by
# the most models come first. Switch the set on for a car: the program asks for every
# parameter once and keeps the ones the car answers. Treat the values with care.
#
# License of this file: CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/),
# the license of OBDb. Changes made: merged over models, converted to the OBDruid PID set
# format (bit positions to byte formulas, imperial units to metric), Polish labels added.
# Converted on 2026-11-16 from 15 repositories:
#   Dacia, Dacia-Dokker, Dacia-Duster, Dacia-Sandero, Renault, Renault-Captur, Renault-Clio
#   Renault-Duster, Renault-Laguna, Renault-Megane, Renault-Scenic, Renault-Symbioz, Renault-Trafic
#   Renault-Twingo, Renault-ZOE
format = 1
id = "renault-dacia"
name = "Renault / Dacia – engine and gearbox"
source = "OBDb (github.com/OBDb), converted with tools/obdb_convert.py; not verified on a car"
license = "CC BY-SA 4.0"
note = "Candidates from a community database, merged over many models and engines: a car answers only some of them. Probing shows which ones."

[match]
wmi = ["VF1", "VF6", "UU1", "93Y"]

