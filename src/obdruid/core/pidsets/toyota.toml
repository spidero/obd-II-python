# Toyota – engine and gearbox - manufacturer parameters converted from OBDb.
#
# NOT VERIFIED ON A CAR. Generated by tools/obdb_convert.py from the community database OBDb
# (https://github.com/OBDb, signalsets/v3/default.json of the repositories listed below).
# Only modules 7E0-7E7 (engine, gearbox) with services 22 and 21; the parameters shared by
# the most models come first. Switch the set on for a car: the program asks for every
# parameter once and keeps the ones the car answers. Treat the values with care.
#
# License of this file: CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/),
# the license of OBDb. Changes made: merged over models, converted to the OBDruid PID set
# format (bit positions to byte formulas, imperial units to metric), Polish labels added.
# Converted on 2026-11-16 from 40 repositories:
#   Toyota, Toyota-4Runner, Toyota-Allion, Toyota-Aqua, Toyota-Auris, Toyota-Avalon-Hybrid
#   Toyota-Aygo, Toyota-C-HR, Toyota-Camry, Toyota-Camry-Hybrid, Toyota-Corolla
#   Toyota-Corolla-Hybrid, Toyota-Crown, Toyota-FJ-Cruiser, Toyota-Fortuner, Toyota-GR86
#   Toyota-GT86, Toyota-Grand-Highlander, Toyota-Hiace, Toyota-Highlander, Toyota-Hilux
#   Toyota-Land-Cruiser, Toyota-Land-Cruiser-Hybrid, Toyota-Matrix, Toyota-Prius
#   Toyota-Prius-Prime, Toyota-Prius-v, Toyota-RAV4, Toyota-RAV4-Hybrid, Toyota-RAV4-Prime
#   Toyota-Sequoia, Toyota-Sienna, Toyota-Tacoma, Toyota-Tundra, Toyota-Veloz, Toyota-Venza-Hybrid
#   Toyota-Vios, Toyota-Yaris, Toyota-Yaris-Cross, Toyota-Yaris-iA
format = 1
id = "toyota"
name = "Toyota – engine and gearbox"
source = "OBDb (github.com/OBDb), converted with tools/obdb_convert.py; not verified on a car"
license = "CC BY-SA 4.0"
note = "Candidates from a community database, merged over many models and engines: a car answers only some of them. Probing shows which ones."

[match]
wmi = ["JT", "SB1", "VNK", "NMT", "4T", "5T", "2T", "MR0"]

[[params]]
key = "CALCULATED_LOAD"
label = "Calculated load"
label_pl = "Obciążenie obliczone"
request = "2101"
formula = "A*100/255"
