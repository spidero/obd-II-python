[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obdruid"
version = "0.5.0"
description = "OBD-II workshop tool: live data, reading and clearing trouble codes (CLI, web UI, desktop GUI)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Piotr Skwarna" }]
dependencies = [
    "obd>=0.7.2",
    "pyserial>=3.5",
    "typer>=0.12",
    "rich>=13",
    "cryptography>=38",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
gui = [
    "obdruid[web]",
    "pywebview>=5",
]
dev = [
    "obdruid[web]",
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
obdruid = "obdruid.cli:app"
obd-tool = "obdruid.cli:app"  # old command name, kept for existing installs

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obdruid = ["web/static/*", "core/dtc_*.json", "core/pidsets/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
