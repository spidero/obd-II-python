[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obd-tool"
version = "0.3.0"
description = "OBD-II workshop tool: live data, reading and clearing trouble codes (CLI, web UI, desktop GUI)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Piotr Skwarna" }]
dependencies = [
    "obd>=0.7.2",
    "pyserial>=3.5",
    "typer>=0.12",
    "rich>=13",
    "cryptography>=38",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
gui = [
    "obd-tool[web]",
    "pywebview>=5",
]
dev = [
    "obd-tool[web]",
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
obd-tool = "obd_tool.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obd_tool = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
